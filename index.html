          "name": "Ile kosztuje wycena szkody?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Wynagrodzenie ustalamy indywidualnie dla każdej sprawy. Najczęściej rozliczamy się od różnicy pomiędzy kwotą, którą udało nam się wywalczyć, a tym, co pierwotnie zaproponował ubezpieczyciel. Warunki zawsze omawiamy przed rozpoczęciem pracy."
          }
        },
        {
          "@type": "Question",
          "name": "Co zrobić zaraz po kolizji?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Najlepiej po prostu do nas zadzwonić. Podpowiemy, jakie zdjęcia wykonać, jakie dane spisać od drugiego uczestnika zdarzenia i jakie kroki podjąć w pierwszej kolejności, żeby nie utrudnić sobie późniejszej likwidacji szkody."
          }
        },
        {
          "@type": "Question",
          "name": "Ile trwa likwidacja szkody?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nie ma jednej uniwersalnej odpowiedzi. Każda sprawa ma inny zakres uszkodzeń, inne dokumenty i innego ubezpieczyciela. Po zapoznaniu się ze szczegółami jesteśmy w stanie realnie oszacować, ile potrwa dana sprawa."
          }
        },
        {
          "@type": "Question",
          "name": "Czy pomagacie odwołać się od zaniżonej wyceny?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tak, to jeden z głównych obszarów naszej pracy. Weryfikujemy kosztorys ubezpieczyciela, przygotowujemy niezależną opinię w systemie Audatex-Eurotax i prowadzimy sprawę dalej, aby odszkodowanie odpowiadało rzeczywistym kosztom naprawy."
          }
        },
        {
          "@type": "Question",
          "name": "Na jakim obszarze działacie?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Bazujemy w Siedlcach, ale obsługujemy klientów z całego regionu, w tym z Warszawy, Łukowa, Garwolina, Sokołowa Podlaskiego, Węgrowa i Białej Podlaskiej. Prowadzimy również sprawy dotyczące szkód powstałych poza granicami Polski."
          }
        },
        {
          "@type": "Question",
          "name": "Jakie dokumenty będą potrzebne?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zwykle wystarczy numer szkody, dane pojazdu, zdjęcia uszkodzeń oraz kosztorys otrzymany od ubezpieczyciela. Jeśli czegoś brakuje, wskażemy dokładnie, co należy skompletować."
          }
        }
